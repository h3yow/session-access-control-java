spring.application.name=session-access-control-java

# 凭证生命周期（本地演示，可按需调短以便观察过期行为）
auth.token.access-ttl=PT15M
auth.token.refresh-ttl=PT12H

# 会话治理：闲置超时（期间既无访问也无刷新则自动失效）与单用户活跃会话容量上限
auth.session.idle-timeout=PT30M
auth.session.max-per-user=5

# 连续登录失败抑制策略
auth.login.max-failures=5
auth.login.lock-duration=PT5M

# 日志：确保审计与关键判定在测试日志中可见
logging.level.com.github.h3yow.sessionaccesscontroljava=INFO
