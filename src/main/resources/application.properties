# 会话式身份认证与访问控制 - 本地配置
spring.application.name=session-access-control-java

# 凭证有效期：访问凭证短期、刷新凭证长期
security.access-token-ttl-seconds=900
security.refresh-token-ttl-seconds=1800

# 连续失败登录抑制：失败 5 次锁定 5 分钟
security.max-login-failures=5
security.lock-duration-seconds=300

# 凭证随机字节数（十六进制编码输出）
security.token-bytes=32

# 便于本地观察审计日志
logging.level.com.github.h3yow=INFO
